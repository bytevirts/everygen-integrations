name: Publish n8n package
on:
  push:
    tags: ['n8n-v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: n8n/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Check release tag matches package
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "n8n-v" + require("./package.json").version) process.exit(1)'
      - run: npm publish --provenance --access public
